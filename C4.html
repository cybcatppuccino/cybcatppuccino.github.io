<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f5">
  <title>C4</title>
  <style>:root {
  color-scheme: light;
  --page:#f6f7f5;
  --surface:#fff;
  --outline:#e2e7e4;
  --board:#e6ece8;
  --cutout:#fbfcfb;
  --ink:#273833;
  --red:#db4d52;
  --yellow:#ddb443;
  --green:#2b966b;
  --muted:#abb7b2;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;width:100%}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--page);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;-webkit-tap-highlight-color:transparent}
.stage{min-height:100vh;min-height:100svh;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:25px;padding:34px 15px 26px}
.board-frame{width:min(94vw,718px);max-width:718px;position:relative}
.board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));gap:clamp(5px,1.1vw,11px);width:100%;padding:clamp(9px,1.75vw,18px);aspect-ratio:7 / 6.05;background:var(--board);border:1px solid #dbe3dd;border-radius:clamp(15px,2.4vw,22px);box-shadow:0 15px 45px #283c3110,0 2px 8px #283c3104;isolation:isolate}
.cell{padding:0;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;border:0;border-radius:50%;position:relative;aspect-ratio:1;appearance:none;outline-offset:3px;background:var(--cutout);color:var(--ink);box-shadow:inset 0 2px 5px #223a2b10,0 1px 0 #fff8;cursor:default;overflow:hidden;transition:box-shadow .16s ease,transform .16s ease,background .16s ease}
.cell:disabled{opacity:1}
.cell.column-click{cursor:pointer}
.cell.column-click:hover:not(.playable){background:#f8faf7}
.cell.playable:hover{box-shadow:inset 0 2px 5px #223a2b0c,0 0 0 3px #a6b7ac70}
.cell.playable:active{transform:scale(.95)}
.cell:focus-visible{outline:3px solid #6e9c86;outline-offset:2px}
.cell.token-red{background:var(--red);box-shadow:inset 0 2px 8px #94232936,0 1px 3px #87212d10}
.cell.token-yellow{background:var(--yellow);box-shadow:inset 0 2px 8px #99752137,0 1px 3px #7b60230f}
.cell.token-red.last,.cell.token-yellow.last{outline:3px solid #879f9388;outline-offset:2px}
.cell.win-four{box-shadow:inset 0 2px 8px #0000001b,0 0 0 3px #ffffffcc,0 0 0 6px #667a7045;z-index:1}
.hint{display:flex;align-items:center;justify-content:center;inset:0;position:absolute;width:100%;height:100%;font-weight:800;font-size:clamp(9px,1.75vw,15.5px);letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;user-select:none;pointer-events:none}
.hint.red{color:var(--red)}
.hint.yellow{color:#bb9228}
.hint.green{color:var(--green)}
.hint.waiting{color:#a3b1aa;font-size:clamp(13px,2.2vw,20px);font-weight:600;letter-spacing:.045em;animation:breathe 1.7s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.33}50%{opacity:.9}}
.toolbar{width:100%;display:flex;align-items:center;justify-content:center;gap:12px}
.tool{display:flex;align-items:center;justify-content:center;width:46px;height:44px;padding:11px;border:1px solid var(--outline);border-radius:12px;background:#fff;color:#778b82;box-shadow:0 3px 12px #3d53440a;cursor:pointer;transition:transform .14s ease,color .14s ease,border-color .14s ease,background .14s ease}
.tool svg{display:block;width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tool:hover:not(:disabled){color:#3f6554;border-color:#b8cbc1;background:#fcfffc;transform:translateY(-1px)}
.tool:active:not(:disabled){transform:scale(.97)}
.tool:focus-visible{outline:3px solid #72aa8f;outline-offset:3px}
.tool:disabled{opacity:.33;cursor:default;box-shadow:none}
.tool.reset{margin-left:10px}
@media(max-width:620px){.stage{gap:20px;padding:22px 9px}.board-frame{width:min(96vw,535px)}.board{gap:clamp(3px,.8vw,7px);padding:clamp(7px,1.5vw,13px);border-radius:16px;aspect-ratio:7 / 6.09}.hint{font-size:clamp(8.5px,2.2vw,12px)}.tool{width:43px;height:42px}.toolbar{gap:10px}}
@media(max-height:570px) and (min-width:750px){.stage{padding:10px;gap:12px}.board-frame{width:min(65vw,calc((100svh - 96px)*7 / 6.05))}.toolbar{gap:10px}.tool{width:38px;height:36px;padding:8px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
/* Exact-WASM principal variation: low-opacity pieces with crisp move numbers. */
.cell.ghost-red{background:rgba(226,66,74,.18);box-shadow:inset 0 0 0 1px rgba(197,47,56,.12)}
.cell.ghost-yellow{background:rgba(236,186,54,.21);box-shadow:inset 0 0 0 1px rgba(186,139,22,.14)}
.cell .hint.ghost-number{color:rgba(80,89,84,.72);font-size:clamp(12px,1.75vw,17px);font-weight:800;letter-spacing:0;animation:none}
.cell.ghost-red .hint.ghost-number{color:rgba(165,54,65,.68)}
.cell.ghost-yellow .hint.ghost-number{color:rgba(153,112,19,.76)}
.cell.ghost-red.playable:hover,.cell.ghost-yellow.playable:hover{box-shadow:inset 0 0 0 2px rgba(92,119,102,.26)}

/* Clear blue edge halo on every fully proven best move; no layout changes. */
.cell.playable.best-move{
  box-shadow:inset 0 2px 5px #223a2b0c,0 0 0 2px #ffffff,0 0 0 6px #1976f2,0 0 0 9px #1976f22a,0 0 19px #1976f282;
  z-index:2;
}
.cell.playable.best-move:hover{
  box-shadow:inset 0 2px 5px #223a2b0c,0 0 0 2px #ffffff,0 0 0 7px #075ee0,0 0 0 10px #1976f238,0 0 23px #075ee0a0;
}

/* DNB-style size selector: height rises from bottom to top. Each outcome
   has its own color, with the selected diamond on a solid colored tile. */
.game-layout{display:flex;align-items:center;justify-content:center;gap:clamp(10px,2.5vw,30px);width:100%;max-width:990px}
.game-main{min-width:0;flex:0 1 auto;width:min(718px,calc((100svh - 115px)*var(--ratio,1.1667)));display:flex;flex-direction:column;align-items:center;gap:25px}
.game-main .board-frame{width:100%;max-width:718px}
.game-main .board{grid-template-columns:repeat(var(--cols,7),minmax(0,1fr));grid-template-rows:repeat(var(--rows,6),auto);aspect-ratio:auto}
.select-grid{flex:none;display:grid;grid-template-columns:24px repeat(5,34px);grid-template-rows:repeat(5,32px) 21px;gap:4px;align-items:stretch}
.axis{display:flex;justify-content:center;align-items:center;color:#9baab1;font-weight:750;font-size:11px;user-select:none}
.size-cell{display:flex;justify-content:center;align-items:center;padding:0;border:1px solid var(--tile-border);border-radius:6px;background:var(--tile-bg);color:var(--tile-color);font-size:16px;font-weight:760;line-height:1;cursor:pointer;transition:.12s ease;touch-action:manipulation}
.size-cell.red{--tile-bg:#fff0ef;--tile-border:#efcece;--tile-color:#db4d52}
.size-cell.yellow{--tile-bg:#fff8e4;--tile-border:#ebdba8;--tile-color:#b78b20;--tile-selected:#c79c31}
.size-cell.green{--tile-bg:#edf8f1;--tile-border:#cde6d7;--tile-color:#2b966b}
.size-cell:hover{border-color:var(--tile-color);box-shadow:0 2px 8px #10283a18}
.size-cell.selected{background:var(--tile-selected,var(--tile-color));color:#fff;border-color:var(--tile-selected,var(--tile-color));box-shadow:0 2px 8px #10283a24;font-size:12px}
.size-cell:focus-visible{outline:2px solid #1976f2;outline-offset:2px}
@media(max-width:620px){.game-layout{gap:8px;align-items:center}.game-main{width:min(535px,calc((100svh - 105px)*var(--ratio,1.1667)));gap:20px}.select-grid{grid-template-columns:15px repeat(5,21px);grid-template-rows:repeat(5,23px) 16px;gap:3px}.axis{font-size:10px}.size-cell{font-size:14px;border-radius:5px}.size-cell.selected{font-size:10px}.game-main .board{padding:clamp(5px,1vw,9px);gap:clamp(2px,.7vw,5px)}.hint{font-size:clamp(7px,1.65vw,12px)}}
@media(max-width:380px){.select-grid{grid-template-columns:13px repeat(5,17px);grid-template-rows:repeat(5,21px) 15px;gap:2px}.game-layout{gap:5px}.stage{padding-inline:6px}}
@media(max-height:570px) and (min-width:750px){.game-main{width:min(65vw,calc((100svh - 96px)*var(--ratio,1.1667)));gap:12px}}

/* Portrait view: place the existing size selector below the board and toolbar.
   Landscape keeps the original side-by-side layout; resize/rotation is CSS-only. */
@media(orientation:portrait){
  .game-layout{flex-direction:column-reverse}
  .game-main{max-width:100%;flex:none}
}
</style>
</head>
<body>
  <main class="stage">
    <div class="game-layout">
    <aside id="sizeGrid" class="select-grid" role="group" aria-label="棋盘大小（宽×高）"></aside>
    <div class="game-main">
    <div class="board-frame"><section id="board" class="board" role="grid" aria-label="标准重力四子棋棋盘，7 列 6 行"></section></div>
    <nav class="toolbar" aria-label="棋谱控制">
      <button class="tool" id="undo" type="button" aria-label="上一步" title="上一步" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 5.5-7 6.5 7 6.5"/></svg>
      </button>
      <button class="tool" id="redo" type="button" aria-label="下一步" title="下一步" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 5.5 7 6.5-7 6.5"/></svg>
      </button>
      <button class="tool reset" id="reset" type="button" aria-label="新局" title="新局" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6v5h-5"/><path d="M20 11a8.2 8.2 0 1 0 1 5"/></svg>
      </button>
    </nav>
    </div>
    </div>
  </main>

function HuffmanCode(bits, value) {
  this.bits = bits;   /* number of bits used for this symbol */
  this.value = value; /* symbol value or table offset */

var MAX_LENGTH = 15;

/* Returns reverse(reverse(key, len) + 1, len), where reverse(key, len) is the
   bit-wise reversal of the len least significant bits of key. */
function GetNextKey(key, len) {
  var step = 1 << (len - 1);
  while (key & step) {
    step >>= 1;
  }
  return (key & (step - 1)) + step;
}

/* Stores code in table[0], table[step], table[2*step], ..., table[end] */
/* Assumes that end is an integer multiple of step */
function ReplicateValue(table, i, step, end, code) {
  do {
    end -= step;
    table[i + end] = new HuffmanCode(code.bits, code.value);
  } while (end > 0);

/* Returns the table width of the next 2nd level table. count is the histogram
   of bit lengths for the remaining symbols, len is the code length of the next

function NextTableBitSize(count, len, root_bits) {
  var left = 1 << (len - root_bits);

        return;
      }
      if(msg.type==='pv' && msg.token===previewToken && hoverColumn===msg.column &&
         msg.sequence===timeline.slice(0,cursor).join(',')){
        const pvKey=currentKey+'|'+msg.column;
        const state=previewCache.get(pvKey);
        if(state && msg.moves.length>=state.moves.length &&
           state.moves.every((m,i)=>m===msg.moves[i])){
          state.moves=msg.moves.slice();
          state.scores=msg.scores.slice();
          // Exact scores proved by the WASM preview are also usable by the
          // ordinary board evaluator after undo, redo or following that line.
          const positionPrefix=timeline.slice(0,cursor);
          for(let i=0;i<state.scores.length;i++){
            saveScore(positionPrefix.concat(state.moves.slice(0,i)),state.moves[i],state.scores[i]);
          }
          propagateHistory(positionPrefix.concat(state.moves));
          state.expected=Number.isInteger(msg.expected)?msg.expected:null;
          if(msg.complete){state.complete=true;previewComputing=false;}
          previewMoves=state.moves.slice();paint();
        }
      }
      if(msg.type==='fatal'){recoverPreview(msg.message);return;}
      if(msg.type==='error'){
        if(!previewReady)recoverPreview(msg.message);
        else{previewComputing=false;console.warn('WASM preview:',msg.message);}
      }
    };
    worker.onerror=e=>recoverPreview(e.message||'Worker failed');
    worker.onmessageerror=()=>recoverPreview('Unrecognized Worker response');
    initWorker(worker,()=>worker===previewWorker);
  }
  function acceptEvaluation(history,col,score){
    if(score===127||score===126)return;
    saveScore(history,col,score);
    propagateHistory(history);
    paint();
  }
  /* One queue, one WASM exact solver, one score per move. The queue never
     switches between fast and slow stages, and never imposes any search
     depth, node count or elapsed-time quota. */
  function makeSearchWorker(){
    if(fatalError)return;
    let worker;
    try{worker=new Worker(workerUrl);}catch(error){
      fatalError=String(error);
      console.error('C4 search worker unavailable:',error);
      queue=[];paint();return;
    }
    const handle={worker,busy:false,ready:false,token:-1,history:null,column:-1};
    workers.push(handle);
    function dispose(reason,fatal=false){
      const index=workers.indexOf(handle);
      if(index<0)return;
      workers.splice(index,1);
      worker.terminate();
      if(fatal){
        fatalError=reason;
        console.error('C4 WASM initialization:',reason);
        // A permanently invalid WASM or book is not a transient error:
        // avoid an infinite worker-create loop consuming RAM and CPU.
        for(const h of workers)h.worker.terminate();
        workers.length=0;queue=[];paint();
        return;
      }
      console.error('C4 WASM worker:',reason);
      if(handle.busy&&handle.token===generation&&
         handle.history?.join(',')===currentKey&&
         typeof lookupScore(handle.history,handle.column)!=='number'){
        if(!queue.some(j=>j.column===handle.column))queue.unshift({column:handle.column});
      }
      // A fresh worker frees a failed or interrupted slot; running searches
      // are never timed out or forcefully retried just for being expensive.
      makeSearchWorker();
      pumpSearch();
    }
    worker.onmessage=({data:msg})=>{
      if(!workers.includes(handle))return;
      if(msg.type==='ready'){
        handle.ready=true;pumpSearch();return;
      }
      if(msg.type==='fatal'){dispose(msg.message,true);return;}
      if(msg.type==='error'){dispose(msg.message,true);return;}
      if(msg.type==='result'){
        if(!handle.busy||msg.column!==handle.column||msg.token!==handle.token)return;
        const history=handle.history,col=handle.column;
        handle.busy=false;handle.history=null;
        // A solved result remains valid even if the view changed while the
        // unbounded proof was running. Canonical/mirror caches share it.
        acceptEvaluation(history,col,msg.score);
        pumpSearch();
      }
    };
    worker.onerror=e=>dispose(e.message||'Worker crashed',true);
    worker.onmessageerror=()=>dispose('Malformed worker response',true);
    initWorker(worker,()=>workers.includes(handle));
  }
  function schedule(){
    generation++;
    const history=timeline.slice(0,cursor);
    for(let i=0;i<history.length;i++)registerPredecessor(history.slice(0,i),history[i]);
    propagateHistory(history);
    hydrate(history);
    if(currentTerminal){queue=[];return;}
    const {heights}=getBoard(history);
    for(const col of priorities)if(heights[col]<HEIGHT){
      if(typeof lookupScore(history,col)!=='number'){
        registerPredecessor(history,col);
        inferPreviousMove(history,col);
      }
    }
    hydrate(history);paint();
    if(fatalError)return;
    queue=priorities.filter(col=>heights[col]<HEIGHT&&
       typeof lookupScore(history,col)!=='number').map(column=>({column}));
    // Stop obsolete position proofs on navigation, rather than allowing an
    // arbitrarily expensive old position to block every worker indefinitely.
    // No mathematically proven cache entry is discarded.
    for(let i=workers.length-1;i>=0;i--){
      const h=workers[i];
      if(h.busy&&h.history?.join(',')!==currentKey){
        h.worker.terminate();workers.splice(i,1);
      }
    }
    while(workers.length<workerCapacity)makeSearchWorker();
    pumpSearch();
  }
  function pumpSearch(){
    if(fatalError||currentTerminal)return;
    for(const handle of workers){
      if(!handle.ready||handle.busy)continue;
      const history=timeline.slice(0,cursor);
      let job=null;
      while(queue.length){
        const next=queue.shift();
        if(typeof lookupScore(history,next.column)==='number')continue;
        if(workers.some(h=>h.busy&&h.token===generation&&h.column===next.column))continue;
        job=next;break;
      }
      if(!job)return;
      handle.busy=true;handle.token=generation;
      handle.history=history;handle.column=job.column;
      handle.worker.postMessage({type:'score',token:generation,
        sequence:history,column:job.column});
    }
  }
  window.addEventListener('pagehide',()=>{
    for(const h of workers)h.worker.terminate();
    if(previewWorker)previewWorker.terminate();
    URL.revokeObjectURL(workerUrl);URL.revokeObjectURL(loaderUrl);
  });
  buildSelector();buildBoard();paint();schedule();
})();
</script>
