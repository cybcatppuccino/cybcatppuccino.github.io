<style>

#app{min-height:100dvh;display:flex;flex-direction:column}.topbar{position:sticky;top:0;z-index:10;background:rgba(243,244,246,.94);backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,0,0,.05);padding:calc(8px + env(safe-area-inset-top)) 12px 8px}.toprow{max-width:860px;margin:auto;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}.brand{font-weight:800;letter-spacing:-.02em}.listname{min-width:0;text-align:center;font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tool{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 10px;font-weight:700;color:#30343b;box-shadow:0 1px 4px rgba(0,0,0,.03)}

.section{padding:14px 18px;border-bottom:1px solid var(--line)}.section:last-child{border-bottom:0}.section h3{font-size:12px;color:#747983;letter-spacing:.08em;text-transform:uppercase;margin:0 0 9px;font-weight:800}.sense{display:grid;grid-template-columns:auto 1fr;gap:8px;padding:5px 0}.num{font-size:11px;background:#eef0f3;color:#666b74;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;margin-top:1px}.zh{font-size:16px;line-height:1.45}.en{font-size:16px;color:var(--sub);line-height:1.45}.item{padding:7px 0}.item+.item{border-top:1px dashed #eceef0}.frline{font-family:Georgia,"Times New Roman",serif;font-size:17px;font-weight:680;line-height:1.4}.source{font-size:10px;color:#9a9ea6;margin-top:4px}.tip{border-left:3px solid #d7b05a;background:#fffbf0;padding:10px 11px;border-radius:0 10px 10px 0;font-size:14px;line-height:1.55}.kvgrid{display:grid;grid-template-columns:minmax(90px,.8fr) minmax(0,1.8fr);gap:7px 10px;font-size:13px}.kvk{color:var(--sub)}.kvv{font-weight:650;overflow-wrap:anywhere}.conj{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.conjcell{background:var(--soft);border-radius:9px;padding:7px 9px}.conjcell b{font-family:Georgia,"Times New Roman",serif}.conjcell span{font-size:11px;color:var(--sub);margin-right:5px}.empty{padding:40px 20px;text-align:center;color:var(--sub)}
.nav{position:fixed;z-index:9;left:0;right:0;bottom:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 72%,rgba(243,244,246,0));pointer-events:none}.navin{max-width:836px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}.nav button{pointer-events:auto;min-height:52px;border:1px solid #d9dce1;background:#fff;border-radius:15px;font-weight:800;box-shadow:0 6px 18px rgba(20,24,31,.08)}.nav button:disabled{opacity:.35}.nav .next{background:#202329;color:#fff;border-color:#202329}
.overlay{position:fixed;inset:0;z-index:30;background:rgba(20,22,26,.38);display:none;align-items:flex-end;justify-content:center}.overlay.show{display:flex}.sheet{width:min(100%,720px);max-height:92dvh;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -14px 45px rgba(0,0,0,.18);overflow:auto;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}.sheethead{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:-16px;background:#fff;padding:5px 0 10px;z-index:2}.sheet h2{margin:0;font-size:20px}.close{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px;font-weight:800}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:11px;color:var(--sub);font-weight:750}.field select{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px}.primary{width:100%;margin-top:12px;border:0;background:#202329;color:#fff;border-radius:13px;padding:13px;font-weight:800}.secondary{width:100%;margin-top:8px;border:1px solid var(--line);background:#fff;color:#202329;border-radius:13px;padding:12px;font-weight:750}.tiny{font-size:11px;color:var(--sub);line-height:1.5;margin-top:8px}
.practice{max-width:720px;margin:0 auto}.qhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.qtype{font-size:12px;font-weight:800;color:#5f6570}.score{font-size:12px;color:var(--sub)}.qcard{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px}.promptlabel{font-size:11px;color:var(--sub);font-weight:800;letter-spacing:.06em}.prompt{font-size:clamp(26px,7vw,46px);font-weight:820;line-height:1.2;margin-top:8px;overflow-wrap:anywhere}.prompt.fr{font-family:Georgia,"Times New Roman",serif}.hintbox{margin-top:12px;background:var(--soft);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.5;color:#515660}.choices{display:grid;gap:9px;margin-top:14px}.choice{border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px 13px;text-align:left;font-weight:700;min-height:48px}.choice.correct{border-color:#91d3ad;background:var(--greenbg);color:var(--green)}.choice.wrong{border-color:#efaaa2;background:var(--redbg);color:var(--red)}.choice.dim{opacity:.55}.feedback{margin-top:12px;padding:10px 12px;border-radius:11px;font-size:13px;line-height:1.5}.feedback.good{background:var(--greenbg);color:var(--green)}.feedback.bad{background:var(--redbg);color:var(--red)}.qactions{display:grid;grid-template-columns:1fr 1.35fr;gap:9px;margin-top:12px}.qactions button{border:1px solid var(--line);border-radius:13px;padding:12px;font-weight:800;background:#fff}.qactions .go{background:#202329;color:#fff;border-color:#202329}
.answerline{min-height:54px;border:2px solid #e1e4e8;border-radius:13px;margin-top:14px;padding:10px 12px;font-family:Georgia,"Times New Roman",serif;font-size:25px;letter-spacing:.03em;display:flex;align-items:center;flex-wrap:wrap;gap:1px}.cursor{display:inline-block;width:2px;height:24px;background:#333;opacity:.55}.tiles,.keyboard{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:13px}.tile,.key{border:1px solid #d9dde2;background:#fff;border-radius:10px;min-width:40px;height:42px;padding:0 10px;font-weight:800;box-shadow:0 2px 5px rgba(0,0,0,.04)}.tile.used{visibility:hidden}.key.small{min-width:48px;font-size:12px}.key.action{background:#eef0f3}.diff-good{color:var(--green);background:var(--greenbg);border-radius:3px}.diff-bad{color:var(--red);background:var(--redbg);text-decoration:underline}.diff-miss{color:#a9adb4}.correctword{margin-top:7px;font-size:13px;color:var(--sub)}
.searchbox{min-height:46px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-family:Georgia,"Times New Roman",serif;font-size:20px;display:flex;align-items:center}.searchresults{margin-top:10px;border-top:1px solid var(--line)}.searchrow{display:grid;grid-template-columns:48px 1fr auto;gap:8px;align-items:center;padding:10px 3px;border-bottom:1px solid var(--line);cursor:pointer}.searchrank{font-size:11px;color:var(--sub)}.searchword{font-family:Georgia,"Times New Roman",serif;font-size:18px;font-weight:700}.searchmeaning{font-size:12px;color:var(--sub);white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}.letters{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}.letter{min-width:36px;height:38px;border:1px solid var(--line);background:#fff;border-radius:9px;font-weight:750}
.statbar{height:6px;background:#eceef1;border-radius:999px;overflow:hidden;margin-top:8px}.statbar i{display:block;height:100%;background:#202329}.hidden{display:none!important}.loading{padding:60px 20px;text-align:center;color:var(--sub)}
@media (min-width:700px){.main{padding-top:18px}.hero{padding:22px 24px 18px}.section{padding:16px 24px}.conj{grid-template-columns:repeat(3,minmax(0,1fr))}.sheet{border-radius:22px;margin-bottom:16px;max-height:88dvh}.overlay{align-items:center}.formgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (prefers-color-scheme:dark){:root{--bg:#111315;--card:#1a1d20;--ink:#f1f2f3;--sub:#a5aab2;--line:#2b2f34;--soft:#202429;--shadow:none;--greenbg:#123521;--redbg:#3a1d1a}.topbar{background:rgba(17,19,21,.93)}.tool,.nav button,.sheet,.close,.field select,.secondary,.choice,.tile,.key,.letter{background:#1a1d20;color:var(--ink)}.nav .next,.primary,.qactions .go{background:#f0f1f2;color:#151719;border-color:#f0f1f2}.sheethead{background:#1a1d20}.tip{background:#2a2415}.chip.strong{background:#272b43;border-color:#373d63;color:#cbd1ff}.answerline{border-color:#30353b}.key.action{background:#24282d}.statbar i{background:#f0f1f2}}

.morphbox{background:var(--soft);border-radius:12px;padding:10px 12px}.morphseg{font-family:Georgia,"Times New Roman",serif;font-size:20px;font-weight:760}.morphnote{font-size:11px;color:var(--sub);line-height:1.5;margin-top:5px}.morphparts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.morphpart{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:6px 8px;font-size:12px}.source-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.source-actions button,.source-actions a{appearance:none;text-decoration:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:7px 9px;font-size:11px;font-weight:750}.online-ety{font-size:13px;line-height:1.6;margin-top:9px;color:var(--sub);white-space:pre-wrap}.compact-details{margin-top:8px;border-top:1px dashed var(--line);padding-top:7px}.compact-details summary{font-size:11px;color:var(--sub);cursor:pointer}.tagrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.cloze-line{font-family:Georgia,"Times New Roman",serif;font-size:clamp(20px,5vw,31px);font-weight:680;line-height:1.45;margin-top:10px}.cloze-gap{display:inline-block;min-width:72px;border-bottom:3px solid #6e737b;color:var(--blue);text-align:center;padding:0 4px}.cloze-translation{font-size:13px;color:var(--sub);line-height:1.5;margin-top:9px}.fullsentence{font-family:Georgia,"Times New Roman",serif;margin-top:6px;color:var(--ink)}.voiceok{color:var(--green)}.voicewarn{color:var(--amber)}

.freqline{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.freqpill,.familyform{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:13px;background:var(--soft)}.familywrap{display:flex;gap:6px;flex-wrap:wrap}.familyform b{font-weight:650}.morphcanon{font-size:13px;color:var(--sub);margin-top:7px}.usagegrid{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:14px}.usagegrid .k{color:var(--sub)}
</style>

<body>
<div id="app">
  <div class="topbar"><div class="toprow">
    <button class="tool" id="listBtn">列表</button>
    <div class="listname" id="listName">第 1 组 · 1–30</div>
    <button class="tool" id="practiceBtn">练习</button>
  </div></div>
  <main class="main" id="main"><div class="loading">正在载入词卡…</div></main>
  <div class="nav" id="viewNav"><div class="navin"><button id="prevBtn">← 上一个</button><button class="next" id="nextBtn">下一个 →</button></div></div>
</div>

<div class="overlay" id="listOverlay"><div class="sheet">
 <div class="sheethead"><h2>选择当前列表</h2><button class="close" data-close="listOverlay">完成</button></div>
 <div class="formgrid">
  <div class="field"><label>列表方式</label><select id="scopeSel"><option value="group">每 30 词一组</option><option value="level">CEFR 等级</option><option value="pos">词性</option><option value="all">全部 3000</option></select></div>
  <div class="field" id="groupField"><label>组别</label><select id="groupSel"></select></div>
  <div class="field hidden" id="levelField"><label>等级</label><select id="levelSel"><option>A1</option><option>A2</option><option>B1</option><option>B2</option></select></div>
  <div class="field hidden" id="posField"><label>词性</label><select id="posSel"></select></div>
  <div class="field"><label>顺序</label><select id="orderSel"><option value="rank">数据库顺序</option><option value="random">随机顺序</option></select></div>
 </div>
 <button class="primary" id="applyListBtn">生成并查看列表</button>
 <button class="secondary" id="searchOpenBtn">快速检索 / 目录</button>
 <div class="tiny">组别按 30 个词划分，共 100 组。CEFR / 词性列表只建立 rank 目录；打开某个词时才载入它所在的 100 词数据包。</div>
</div></div>

<div class="overlay" id="practiceOverlay"><div class="sheet">
 <div class="sheethead"><h2>练习当前列表</h2><button class="close" data-close="practiceOverlay">取消</button></div>
 <div class="formgrid">
  <div class="field" style="grid-column:span 2"><label>题型</label><select id="typeSel">
   <option value="mixed">混合练习</option><option value="frzh">法语 → 中文四选一</option><option value="zhfr">中文 → 法语四选一</option><option value="spell_easy">字母块拼写 · 容易</option><option value="spell_hard">虚拟键盘拼写 · 困难</option><option value="gender">阴阳性选择</option><option value="conj">现在时变位</option><option value="example_easy">例句挖空 · 字母块</option><option value="example_hard">例句挖空 · 虚拟键盘</option>
  </select></div>
  <div class="field"><label>题数</label><select id="countSel"><option>10</option><option selected>20</option><option>30</option><option>50</option></select></div>
  <div class="field"><label>题目顺序</label><select id="qOrderSel"><option value="random">随机</option><option value="rank">按列表顺序</option></select></div>
 </div>
 <button class="primary" id="startPracticeBtn">开始练习</button>
 <div class="tiny">四选一优先从同等级、同词性、rank 接近或拼写相似的词中选干扰项。单词拼写与例句挖空均只使用页面内字母块/虚拟键盘，不调用系统键盘。</div>
</div></div>

<div class="overlay" id="searchOverlay"><div class="sheet">
 <div class="sheethead"><h2>快速检索</h2><button class="close" data-close="searchOverlay">关闭</button></div>
 <div class="searchbox" id="searchBox"><span id="searchText"></span><span class="cursor"></span></div>
 <div class="letters" id="searchLetters"></div>
 <div class="tiny">输入法语词头。也可以清空后直接按首字母浏览。整个检索不使用系统输入法。</div>
 <div class="searchresults" id="searchResults"></div>
</div></div>

<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const INDEX=window.FC_INDEX||[]; const BYR=new Map(INDEX.map(x=>[x.r,x])); window.FC_PACKAGES=window.FC_PACKAGES||{};
const POS_LABEL={noun:'名词',verb:'动词',adj:'形容词',adv:'副词',prep:'介词',conj:'连词',pron:'代词',num:'数词',det:'限定词',interj:'感叹词'};
const FIELD_LABEL={masculine_singular:'阳性单数',feminine_singular:'阴性单数',masculine_plural:'阳性复数',feminine_plural:'阴性复数',before_vowel_masculine_singular:'元音前阳性单数',imperfect_je:'未完成过去时 · je',future_je:'简单将来时 · je',past_participle:'过去分词',auxiliary:'助动词',masculine:'阳性形式',feminine:'阴性形式',also_seen:'也可见',note_zh:'说明',note_en:'Note',prefix:'前缀',suffix:'后缀',root:'词根',stem:'词干',singular:'单数',plural:'复数'};
let state={list:Array.from({length:30},(_,i)=>i+1),name:'第 1 组 · 1–30',idx:0,mode:'view',practice:null};
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zœæç'-]/g,'')}
function lev(a,b){a=norm(a);b=norm(b);let p=Array(b.length+1).fill(0).map((_,i)=>i);for(let i=1;i<=a.length;i++){let q=[i];for(let j=1;j<=b.length;j++)q[j]=Math.min(q[j-1]+1,p[j]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=q}return p[b.length]}
function genderLabel(g){return g==='m'?'阳性 m':g==='f'?'阴性 f':g==='m/f'?'阴 / 阳性 m/f':g||''}
function packId(rank){return String(Math.floor((rank-1)/100)+1).padStart(3,'0')}
function loadPack(id){return new Promise((resolve,reject)=>{if(window.FC_PACKAGES[id])return resolve();if(window.FC_ALL_WORDS){window.FC_PACKAGES[id]=window.FC_ALL_WORDS.slice((+id-1)*100,+id*100);return resolve()}const s=document.createElement('script');s.src=`data/pack_${id}.js`;s.onload=resolve;s.onerror=()=>reject(new Error('无法载入数据包 '+id));document.head.appendChild(s)})}
async function getWord(rank){let id=packId(rank);await loadPack(id);return window.FC_PACKAGES[id].find(w=>w.rank===rank)}
function showOverlay(id){$('#'+id).classList.add('show')} function hideOverlay(id){$('#'+id).classList.remove('show')} $$('[data-close]').forEach(b=>b.onclick=()=>hideOverlay(b.dataset.close));

// French TTS: select only an installed French voice. If none exists, stay silent rather than mispronouncing in English.
let frenchVoice=null;
function voiceScore(v){let l=(v.lang||'').toLowerCase(),n=(v.name||'').toLowerCase(),score=0;if(l==='fr-fr')score+=100;else if(l.startsWith('fr-'))score+=70;else if(l==='fr')score+=60;if(v.localService)score+=5;if(/thomas|amelie|amélie|audrey|denise|henri|hortense|french|français|france/.test(n))score+=3;return score}
function refreshFrenchVoice(){if(!('speechSynthesis'in window))return null;let voices=speechSynthesis.getVoices()||[];let fr=voices.filter(v=>/^fr(?:[-_]|$)/i.test(v.lang||''));fr.sort((a,b)=>voiceScore(b)-voiceScore(a));frenchVoice=fr[0]||null;return frenchVoice}
if('speechSynthesis'in window){refreshFrenchVoice();if(speechSynthesis.addEventListener)speechSynthesis.addEventListener('voiceschanged',refreshFrenchVoice);else speechSynthesis.onvoiceschanged=refreshFrenchVoice;setTimeout(refreshFrenchVoice,200);setTimeout(refreshFrenchVoice,900)}
function speak(t,attempt=0){if(!('speechSynthesis'in window))return;let v=refreshFrenchVoice();if(!v){if(attempt<2)setTimeout(()=>speak(t,attempt+1),260);return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang=v.lang||'fr-FR';u.voice=v;u.rate=.86;u.pitch=1;speechSynthesis.speak(u)}

function renderItems(title,items){if(!items||!items.length)return'';return `<section class="section"><h3>${esc(title)}</h3>${items.map(x=>`<div class="item"><div class="frline" lang="fr">${esc(x.fr||'')}</div><div class="zh">${esc(x.zh||'')}</div>${x.en?`<div class="en">${esc(x.en)}</div>`:''}</div>`).join('')}</section>`}
function renderSenses(w){let arr=[...(w.senses||[])];let sup=w.learning_extension?.supplemental_senses||[];arr.push(...sup);if(!arr.length)return'';return `<section class="section"><h3>义项</h3>${arr.map((x,i)=>`<div class="sense"><div class="num">${i+1}</div><div><div class="zh">${esc(x.zh||'')}${x.pos?` <span class="chip">${esc(POS_LABEL[x.pos]||x.pos)}</span>`:''}${x.gender?` <span class="chip">${esc(x.gender)}</span>`:''}</div>${x.en?`<div class="en">${esc(x.en)}</div>`:''}</div></div>`).join('')}</section>`}

function updateAnswerLine(){let q=state.practice.q;if(!$('#answerLine'))return;$('#answerLine').innerHTML=esc(q.input||'')+'<span class="cursor"></span>'}
function diffHTML(got,target){let a=splitChars(got),b=splitChars(target),n=Math.max(a.length,b.length),out='';for(let i=0;i<n;i++){if(i>=a.length)out+=`<span class="diff-miss">·</span>`;else if(i<b.length&&a[i].toLocaleLowerCase('fr')===b[i].toLocaleLowerCase('fr'))out+=`<span class="diff-good">${esc(a[i])}</span>`;else out+=`<span class="diff-bad">${esc(a[i])}</span>`}return out}
function checkSpell(){let q=state.practice.q;if(q.answered)return;let ok=q.input.normalize('NFC').toLocaleLowerCase('fr')===q.target.toLocaleLowerCase('fr');q.answered=true;ok?state.practice.correct++:state.practice.wrong++;$('#answerLine').innerHTML=diffHTML(q.input,q.target);let extra=q.gap?`<div class="fullsentence">${esc(q.gap.before)}<b>${esc(q.target)}</b>${esc(q.gap.after)}</div><div class="en">词条：${esc(q.w.fr)}</div>`:'';$('#feedback').innerHTML=`<div class="feedback ${ok?'good':'bad'}">${ok?'拼写正确':'拼写有误'}${ok?'':`<div class="correctword">正确答案：<b>${esc(q.target)}</b></div>`}${extra}</div>`;$('#submitSpell').classList.add('hidden');$('#nextQ').classList.remove('hidden');$('#nextQ').onclick=()=>advance()}
function advance(_,skip=false){let p=state.practice;if(skip&&!p.q?.answered)p.wrong++;p.i++;renderQuestion()}$('#startPracticeBtn').onclick=()=>{let type=$('#typeSel').value,total=+$('#countSel').value,order=$('#qOrderSel').value;state.practice={type,total,order,i:0,correct:0,wrong:0};state.mode='practice';hideOverlay('practiceOverlay');scrollTo(0,0);renderQuestion()};function finishPractice(){let p=state.practice,acc=p.total?Math.round(p.correct/p.total*100):0;$('#main').innerHTML=`<div class="practice"><div class="qcard"><div class="promptlabel">练习完成</div><div class="prompt">${acc}%</div><div class="meaning-en">正确 ${p.correct} · 错误/跳过 ${p.wrong} · 共 ${p.total} 题</div><div class="statbar"><i style="width:${acc}%"></i></div><button class="primary" id="againBtn">再练一次</button><button class="secondary" id="backViewBtn">返回查看</button></div></div>`;$('#againBtn').onclick=()=>{state.practice.i=0;state.practice.correct=0;state.practice.wrong=0;renderQuestion()};$('#backViewBtn').onclick=endPractice}function endPractice(){state.practice=null;state.mode='view';renderWord()}
$$('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('show')}));renderWord();
