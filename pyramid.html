<script>'use strict';
const SHAPES=[['xxx','xxo'],['xxxx','xooo'],['xxxx'],['xxo','oxx','oox'],['xx','xx'],['xx','xo'],['xxx','xoo'],['xxx','xox'],['xxxx','oxoo'],['xxx','xoo','xoo'],['oxo','xxx','oxo'],['xxxo','ooxx']];
const PIECE_LABELS=['P','L','I','W','O','C','J','U','Y','V','X','N'];
const DEFAULT_COLORS=['#84d0fe','#f7bb75','#71e1ba','#e9bcfd','#fcf191','#a6adb4','#b8836a','#fe94a5','#94fd85','#a7fcfc','#a392f6','#fb84fb'];
const COLORS=(()=>{try{const stored=JSON.parse(localStorage.getItem('pyramid-unified-palette-v1'));if(Array.isArray(stored)&&stored.length===12&&stored.every(c=>typeof c==='string'&&/^#[0-9a-f]{6}$/i.test(c)))return stored}catch(e){}return DEFAULT_COLORS.slice()})();

 });

  paintColorWheel();overlay.hidden=false;

}
